name: Trajectory Lab unit tests

on:
  pull_request:
    branches:
      - trajectory-lab
  push:
    branches:
      - trajectory-lab
      - "trajectory-*"

jobs:
  trajectory-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install minimal test dependency
        run: python -m pip install "pydantic<2"
      - name: Run trajectory unit tests
        run: python -m unittest discover -s tests -p "test_trajectory.py" -v
