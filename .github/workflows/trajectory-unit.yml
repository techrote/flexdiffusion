name: Trajectory Lab unit tests

on:
  pull_request:
    branches:
      - trajectory-lab
      - trajectory-artifacts
  push:
    branches:
      - trajectory-lab
      - "trajectory-*"

jobs:
  trajectory-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install minimal test dependency
        run: python -m pip install "pydantic<2"
      - name: Compile trajectory Python helpers
        run: >-
          python -m py_compile
          ui/easydiffusion/trajectory.py
          ui/easydiffusion/trajectory_artifacts.py
          ui/easydiffusion/trajectory_types.py
          ui/easydiffusion/output_steps.py
          ui/easydiffusion/types.py
          ui/easydiffusion/backends/sdkit_common.py
          ui/easydiffusion/tasks/render_images.py
          scripts/trajectory_smoke.py
      - name: Check Trajectory Lab UI plugin syntax
        run: |
          node --check ui/plugins/ui/trajectory-output-steps.plugin.js
          node --check ui/plugins/ui/sampler-comparison.plugin.js
      - name: Check sampler comparison helper semantics
        run: |
          node <<'NODE'
          const assert = require('assert')
          require('./ui/plugins/ui/sampler-comparison.plugin.js')
          const helper = globalThis.__flexDiffusionSamplerComparisonTest.orderedUniqueSamplerNames
          assert.deepStrictEqual(helper('heun', ['dpmpp_2m', 'heun', 'euler']), ['heun', 'dpmpp_2m', 'euler'])
          assert.deepStrictEqual(helper('dpmpp_2m', []), ['dpmpp_2m'])
          assert.deepStrictEqual(helper('', ['heun', 'heun']), ['heun'])
          NODE
      - name: Parse Windows development setup helper
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/setup_flexdiffusion_dev.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Run trajectory unit tests
        run: python -m unittest discover -s tests -p "test_trajectory*.py" -v
